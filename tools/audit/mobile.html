<!doctype html><meta charset="utf-8"><title>mobile preview</title>
<style>
  body{margin:0;padding:12px;background:#e9e9ef;font:11px system-ui;display:flex;gap:12px;align-items:flex-start}
  figure{margin:0}
  iframe{width:390px;height:3000px;border:1px solid #bbb;background:#fff;display:block}
  figcaption{padding:4px 0;font-weight:600}
</style>
<script>
  const routes = new URLSearchParams(location.search).get('r')?.split(',') || ['/']
  document.write(routes.map(r =>
    `<figure><figcaption>${r} @390</figcaption><iframe src="${r}" scrolling="no"></iframe></figure>`).join(''))
</script>
