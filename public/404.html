<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>उर्वी वर्मा</title>
    <script>
      // GitHub Pages has no server-side rewrite, so a deep link like
      // /work/elderease lands here. Encode the path into a query string and
      // bounce to the app, which decodes it back in index.html.
      // pathSegmentsToKeep = 0 because this is a user site served from root.
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          '/?/' +
          l.pathname.slice(1).replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1) : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
